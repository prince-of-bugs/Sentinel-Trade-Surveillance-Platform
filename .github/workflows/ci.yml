name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run unit tests
        run: mvn -B -ntp verify

      # Proves the app boots and the Flyway migrations apply to a real Postgres.
      - name: Smoke test case-service
        run: |
          java -jar case-service/target/case-service-*.jar > case-service.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8083/actuator/health | grep -q '"status":"UP"'; then
              echo "case-service is UP"; exit 0
            fi
            sleep 2
          done
          echo "case-service did not become healthy"; cat case-service.log; exit 1

  infra:
    name: Validate infra files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: shellcheck
        run: shellcheck infra/kafka/*.sh
